    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; user-select: none; }
        .scene { perspective: 1200px; width: 100%; height: 100%; }
        .card-object { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; background-color: white; overflow: hidden; }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .btn-press:active { transform: scale(0.96); transition: transform 0.1s; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        
        /* 🔥 核心修复：全局 Markdown 排版美化 */
        .markdown-body { font-size: 0.95rem; line-height: 1.7; word-wrap: break-word; overflow-wrap: break-word; }
        .markdown-body > *:first-child { margin-top: 0; }
        .markdown-body p { margin-bottom: 0.8em; }
        
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 800; margin-top: 1.2em; margin-bottom: 0.6em; line-height: 1.3; }
        .markdown-body h1 { font-size: 1.4em; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.2em; }
        .markdown-body h3 { font-size: 1.1em; }
        
        .markdown-body ul { list-style-type: disc; padding-left: 1.4em; margin-bottom: 1em; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.4em; margin-bottom: 1em; }
        .markdown-body li { margin-bottom: 0.3em; }
        
        /* 🔥 重点修复：全局高亮样式 (卡片背面/长难句) */
        /* 改为深色文字 + 浅色背景，对比度极高 */
        .markdown-body strong { 
            font-weight: 900; 
            color: #4338ca; /* 深靛蓝，看得清 */
            background: rgba(99, 102, 241, 0.1); /* 极淡的蓝底 */
            padding: 0 4px; 
            border-radius: 4px; 
            border-bottom: 2px solid rgba(99, 102, 241, 0.2);
        }
        
        /* 引用块 */
        .markdown-body blockquote { border-left: 4px solid rgba(0,0,0,0.2); padding-left: 1em; margin: 1em 0; font-style: italic; background: rgba(0,0,0,0.03); padding: 8px 12px; border-radius: 0 8px 8px 0; }
        .markdown-body code { background-color: rgba(0,0,0,0.06); padding: 0.2em 0.4em; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #c2410c; }

        /* 动画 */
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.2s ease-out; }
    </style>

<script>
        // 1. 全局错误捕捉
        window.onerror = function(msg, url, line, col, error) {
            var root = document.getElementById('root');
            if(root) root.innerHTML = '<div style="padding:20px;text-align:center;color:red;"><h3>发生错误</h3><p>'+msg+'</p><p>Line: '+line+'</p></div>';
        };

        // 2. 注册独立的 sw.js 文件
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 指定 scope 为 ./ 确保能控制同级目录下的所有文件
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(reg => {
                        console.log('✅ ServiceWorker 注册成功:', reg.scope);
                        
                        // 监听更新
                        reg.onupdatefound = () => {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = () => {
                                if (installingWorker.state === 'installed') {
                                    if (navigator.serviceWorker.controller) {
                                        console.log('检测到新版本，请刷新页面');
                                        // 可选：弹窗提示用户刷新
                                    } else {
                                        console.log('离线资源已就绪！');
                                    }
                                }
                            };
                        };
                    })
                    .catch(err => console.error('❌ ServiceWorker 注册失败:', err));
            });
        }
    </script>

            if (text.includes(' ') || text.length > 20) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'en-US';

// 🔥 核心修复：优化算法，引入“日历日”对齐、最大数量限制和 Fuzzing（模糊因子）
const calculateNextReview = (rating, currentInterval, easeFactor, currentReviewCount, lastReviewTime) => {
    const now = Date.now();
    // 判定是否为“同一天内的短期重复” (例如：距离上次复习小于 16 小时)
    const isSameDayRepeat = lastReviewTime && (now - lastReviewTime < 16 * 60 * 60 * 1000);

    let nextInterval, nextEaseFactor = easeFactor;
    const newReviewCount = (currentReviewCount || 0) + 1;
    let nextReviewTime = 0; 

    if (rating === 1) { // 不认识
        return { 
            interval: 0, 
            easeFactor: Math.max(1.3, easeFactor - 0.2), 
            isDueNow: true, 
            reviewCount: newReviewCount,
            nextReview: now 
        };
    } else if (rating === 2) { // 不熟
        return { 
            interval: 0.5, 
            easeFactor: Math.max(1.3, easeFactor - 0.15), 
            isDueNow: true, 
            reviewCount: newReviewCount,
            nextReview: now + (0.5 * 24 * 60 * 60 * 1000) 
        }; 
    } else { // 认识 (Rating 3)
        if (isSameDayRepeat && currentInterval > 0) {
            nextInterval = currentInterval;
            nextReviewTime = now + (nextInterval * 24 * 60 * 60 * 1000);
        } else {
            if (currentInterval === 0) nextInterval = 1; // 修正：初次掌握直接设为1天
            else if (currentInterval <= 1) nextInterval = 3;
            else nextInterval = Math.round(currentInterval * easeFactor);
            
            nextEaseFactor = easeFactor + 0.1;

            // 🛠️ 算法优化：加入 5% 的随机模糊因子 (Fuzzing)，防止复习堆积
            // 例如 10 天可能会变成 9.5~10.5 天，打散同一天复习的单词
            const fuzz = 0.95 + Math.random() * 0.1; 
            nextInterval = nextInterval * fuzz;

            // 对齐到“目标日期的凌晨 4 点”
            const nowDate = new Date(now);
            const daysToAdd = Math.ceil(nextInterval); 
            
            const targetDate = new Date(nowDate);
            targetDate.setDate(nowDate.getDate() + daysToAdd); 
            targetDate.setHours(4, 0, 0, 0); 
            
            if (targetDate.getTime() <= now) {
                 targetDate.setDate(targetDate.getDate() + 1);
            }
            
            nextReviewTime = targetDate.getTime();
        }
        
        return { 
            interval: nextInterval, 
            easeFactor: nextEaseFactor, 
            isDueNow: false, 
            reviewCount: newReviewCount,
            nextReview: nextReviewTime, 
            lastReviewTime: now
        };
    }
};

                                            <button onClick={(e) => handleDeleteGroup(e, g.words)} className="p-1.5 bg-red-50 text-red-500 rounded hover:bg-red-100 transition" title="删除"><Icon name="Trash2" size={16}/></button>
                                        </div>

                                        {/* 第二排：学习类按键 (拼写全、背生词、拼生词) - 靠右对齐 */}
                                        <div className="flex space-x-1">
                                            <button onClick={(e) => { e.stopPropagation(); setSessionConfig({ type: 'group_spelling', category, batchId: g.batchId, batchIndex: g.batchIndex }); setView('spelling'); }} className="p-1.5 bg-cyan-50 text-cyan-600 rounded hover:bg-cyan-100 transition" title="拼写模式(全)"><Icon name="Keyboard" size={16}/></button>
                                            <button onClick={(e) => { e.stopPropagation(); setSessionConfig({ type: 'group_study', filter: 'hard', category, batchId: g.batchId, batchIndex: g.batchIndex }); setView('study'); }} className="p-1.5 bg-orange-50 text-orange-600 rounded hover:bg-orange-100 transition" title="只背生词"><Icon name="Book" size={16}/></button>
                                            <button onClick={(e) => { e.stopPropagation(); setSessionConfig({ type: 'group_spelling', filter: 'hard', category, batchId: g.batchId, batchIndex: g.batchIndex }); setView('spelling'); }} className="p-1.5 bg-red-50 text-red-600 rounded hover:bg-red-100 transition" title="只拼生词"><Icon name="Keyboard" size={16}/></button>
                                        </div>
                                    </div>
                                    </div>
                                    <div className="mb-3 flex-1">{g.desc ? (<p className="text-xs text-gray-500 bg-gray-50 p-2 rounded border border-gray-100 line-clamp-2">{g.desc}</p>) : (<p className="text-xs text-gray-300 italic py-2">暂无备注...</p>)}</div>
                                    <div className="mt-auto">
                                        <div className="flex justify-between text-xs text-gray-500 mb-1">
                                            <span>进度</span>
                                            <span className="font-medium text-indigo-600">{Math.round(((g.green + g.yellow)/g.total)*100)}%</span>
                                        </div>
                                        <div className="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden flex">
                                            <div className="h-full bg-emerald-500 transition-all duration-500" style={{width: `${(g.green/g.total)*100}%`}}></div>
                                            <div className="h-full bg-amber-400 transition-all duration-500" style={{width: `${(g.yellow/g.total)*100}%`}}></div>
                                            <div className="h-full bg-red-100" style={{width: `${(g.red/g.total)*100}%`}}></div>
                                        </div>
                                        {(() => {
                                            const sp = getSpellingProgress(g.batchId, g.batchIndex);
                                            return sp > 0 ? (
                                                <div className="mt-2">
                                                    <div className="flex justify-between text-[10px] text-gray-400 mb-0.5">
                                                        <span>拼写进度</span>
                                                        <span>{sp}%</span>
                                                    </div>
                                                    <div className="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                                        <div className="h-full bg-cyan-400 transition-all duration-500" style={{width: `${sp}%`}}></div>
                                                    </div>
                                                </div>
                                            ) : null;
                                        })()}
                                        <div className="flex justify-between mt-2 text-[10px] text-gray-400 font-mono">
                                            <span className="flex items-center"><div className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></div>{g.green}</span>
                                            <span className="flex items-center"><div className="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1"></div>{g.yellow}</span>
                                            <span className="flex items-center"><div className="w-1.5 h-1.5 rounded-full bg-red-200 mr-1"></div>{g.red}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        }
                    </div>

                    {storyModal.open && (
                        <div className="fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={() => setStoryModal({ ...storyModal, open: false })}>
                            <div className="bg-white w-full max-w-2xl max-h-[80vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-amber-50">
                                    <h3 className="font-bold text-amber-800 flex items-center"><span className="mr-2">✨</span> {storyModal.batchName}</h3>
                                    <button onClick={() => setStoryModal({ ...storyModal, open: false })} className="p-2 hover:bg-amber-100 rounded-full text-amber-800"><Icon name="X" size={20} /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 custom-scroll bg-white">
                                    {storyModal.loading && !storyModal.content && (
                                        <div className="flex flex-col items-center justify-center py-10 space-y-4">
                                            <div className="w-10 h-10 border-4 border-amber-200 border-t-amber-500 rounded-full animate-spin"></div>
                                            <p className="text-gray-500 text-sm animate-pulse">正在抓取生词并编织故事，请稍候...</p>

                                    )}
                                    <div className="markdown-body text-gray-800 leading-relaxed space-y-4" dangerouslySetInnerHTML={{ __html: marked.parse(storyModal.content) }} />
                                </div>
                                <div className="p-4 border-t border-gray-100 bg-gray-50 text-right">
                                    <button onClick={() => setStoryModal({ ...storyModal, open: false })} className="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold transition">关闭</button>
                                </div>

                        </div>
                    )}

                    {moveModal.open && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setMoveModal({open:false, targetGroupWords:[]})}>
                            <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold mb-4 text-gray-800">转移该组单词到...</h3>
                                <div className="grid grid-cols-2 gap-3 mb-4">{['high', 'medium', 'low', 'zero'].map(cat => (<button key={cat} onClick={() => performMove(cat)} className="py-3 bg-gray-50 hover:bg-indigo-50 border border-gray-200 hover:border-indigo-200 rounded-xl font-bold text-gray-700 hover:text-indigo-700 transition uppercase">{cat}</button>))}</div>
                                <div className="border-t border-gray-100 pt-4 mt-2"><label className="text-xs font-bold text-gray-400 uppercase mb-2 block">自定义分组</label><div className="flex space-x-2"><input type="text" value={customTarget} onChange={e => setCustomTarget(e.target.value)} placeholder="输入分组名..." className="flex-1 p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"/><button onClick={() => performMove(customTarget)} disabled={!customTarget.trim()} className="px-4 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-50">确定</button></div></div>
                                <button onClick={() => setMoveModal({open:false, targetGroupWords:[]})} className="mt-6 w-full py-3 text-gray-500 hover:bg-gray-50 rounded-xl font-medium">取消</button>
                            </div>
                        </div>
                    )}
                    {editModal.open && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setEditModal({...editModal, open:false})}>
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold mb-4 text-gray-800">编辑分组信息</h3>
                                <div className="mb-4"><label className="block text-xs font-bold text-gray-500 uppercase mb-1">分组名称</label><input type="text" value={editModal.currentName} onChange={e => setEditModal({...editModal, currentName: e.target.value})} placeholder="例如: 2010年真题阅读A" className="w-full p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" autoFocus /></div>
                                <div className="mb-6"><label className="block text-xs font-bold text-gray-500 uppercase mb-1">备注 / 简介</label><textarea value={editModal.currentDesc} onChange={e => setEditModal({...editModal, currentDesc: e.target.value})} placeholder="例如: 这部分单词比较难，需要多复习几次..." className="w-full p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 h-24 resize-none"></textarea></div>
                                <div className="flex space-x-3"><button onClick={() => setEditModal({...editModal, open:false})} className="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition">取消</button><button onClick={saveGroupInfo} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition">保存</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

const StudySession = ({ words, setWords, sessionConfig, onExit, config, setChatSession }) => {
            const [queue, setQueue] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [isFinished, setIsFinished] = useState(false);
            
            const [isGeneratingNote, setIsGeneratingNote] = useState(false);
            const [syntaxLoading, setSyntaxLoading] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            // 模态框状态
            const [syntaxModal, setSyntaxModal] = useState({ open: false, content: '' });
            const [addMeaningModal, setAddMeaningModal] = useState({ open: false, pos: 'n.', def: '' }); 

            // 历史记录栈
            const [history, setHistory] = useState([]);

            // 预设词性列表
            const POS_OPTIONS = [
                { val: "n.", label: "n. 名词" }, { val: "v.", label: "v. 动词" }, { val: "vt.", label: "vt. 及物" },
                { val: "vi.", label: "vi. 不及物" }, { val: "adj.", label: "adj. 形容词" }, { val: "adv.", label: "adv. 副词" },
                { val: "prep.", label: "prep. 介词" }, { val: "conj.", label: "conj. 连词" }, { val: "pron.", label: "pron. 代词" },
                { val: "art.", label: "art. 冠词" }, { val: "num.", label: "num. 数词" }, { val: "int.", label: "int. 感叹词" },
                { val: "abbr.", label: "abbr. 缩写" }, { val: "phrase", label: "phrase 短语" }, { val: "pl.", label: "pl. 复数" }
            ];

            // 1. 生成唯一的进度 Key
            const getProgressKey = () => {
                const dateStr = new Date().toDateString(); 
                const base = `kaoyan_prog_${dateStr}_${sessionConfig.type}`;
                if (sessionConfig.type === 'group_study') {
                    return `${base}_${sessionConfig.batchId}_${sessionConfig.batchIndex}`;
                }
                return `${base}_review`; 
            };

           // 🔥 修复版 saveProgress：给存档瘦身，防止 LocalStorage 爆满
            const saveProgress = (newQueue, newIdx) => {
                try {
                    const key = getProgressKey();
                    
                    // 1. 瘦身逻辑：只保存必要数据
                    // chatHistory 和 aiNote 体积很大，且已存在主数据库(words)中
                    // 进度条(queue)里只需保留 ID 和状态，避免重复占用空间
                    const slimQueue = newQueue.map(w => {
                        // 解构出大字段并丢弃(...rest 即为保留的部分)
                        const { chatHistory, aiNote, aiSyntax, ...rest } = w;
                        return rest;
                    });

                    const data = {
                        queue: slimQueue, 
                        currentIdx: newIdx,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) { 
                    // 2. 容错处理：如果还是存不下，只打印警告，不要崩坏页面
                    console.warn("进度保存失败 (空间不足)，但不影响主数据:", e); 
                }
            };

            // 3. 清除进度
            const clearProgress = () => {
                localStorage.removeItem(getProgressKey());
            };

            // --- 撤回 ---
            const handleUndo = (e) => {
                if(e) e.stopPropagation();
                if (history.length === 0) return;
                
                const lastAction = history[history.length - 1];
                const newHistory = history.slice(0, -1);

                const restoredWords = words.map(w => w.id === lastAction.wordId ? { ...w, stats: lastAction.oldStats } : w);
                setWords(restoredWords);
                localStorage.setItem('kaoyan_vocab_list', JSON.stringify(restoredWords));

                setCurrentIdx(lastAction.idx);
                setIsFinished(false); 
                setIsFlipped(true); 

                let newQueue = [...queue];
                if (lastAction.addedToQueue) {
                    newQueue = newQueue.slice(0, newQueue.length - 1);
                    setQueue(newQueue);
                }
                
                saveProgress(newQueue, lastAction.idx);
                setHistory(newHistory);
            };

            // --- 保存新释义 ---
            const handleSaveNewMeaning = () => {
                if (!addMeaningModal.pos || !addMeaningModal.def) return alert("请填写完整信息");
                
                const newMeaningObj = { pos: addMeaningModal.pos.trim(), def: addMeaningModal.def.trim(), sentence: "", isMastered: false };
                const sortMeanings = (list) => [...list].sort((a, b) => a.pos.localeCompare(b.pos));

                const newWords = words.map(w => {
                    if (w.id === currentCard.id) return { ...w, meanings: sortMeanings([...w.meanings, newMeaningObj]) };
                    return w;
                });
                setWords(newWords);
                localStorage.setItem('kaoyan_vocab_list', JSON.stringify(newWords));

                const newQueue = [...queue];
                newQueue[currentIdx] = { ...newQueue[currentIdx], meanings: sortMeanings([...newQueue[currentIdx].meanings, newMeaningObj]) };
                setQueue(newQueue);
                saveProgress(newQueue, currentIdx); 

                setAddMeaningModal({ open: false, pos: 'n.', def: '' });
            };

            // --- 删除释义 ---
            const handleDeleteMeaning = (e, originalIdx) => {
                e.stopPropagation();
                if (!confirm("确定要删除这条释义吗？")) return;
                const currentMeanings = queue[currentIdx].meanings;
                if (currentMeanings.length <= 1) return alert("至少保留一个释义，无法删除。");
                const newMeanings = currentMeanings.filter((_, i) => i !== originalIdx);

                const newQueue = [...queue];
                newQueue[currentIdx] = { ...newQueue[currentIdx], meanings: newMeanings };
                setQueue(newQueue);
                saveProgress(newQueue, currentIdx); 

                const newWords = words.map(w => { if (w.id === currentCard.id) return { ...w, meanings: newMeanings }; return w; });
                setWords(newWords);
                localStorage.setItem('kaoyan_vocab_list', JSON.stringify(newWords));
            };

            // 初始化
            useEffect(() => {
                const key = getProgressKey();
                const savedStr = localStorage.getItem(key);
                let loaded = false;

                if (savedStr) {
                    try {
                        const saved = JSON.parse(savedStr);
                        if (saved.queue && saved.queue.length > 0) {
                            console.log("🔥 恢复进度:", saved.currentIdx, "/", saved.queue.length);
                            setQueue(saved.queue);
                            setCurrentIdx(saved.currentIdx);
                            loaded = true;
                            if (saved.currentIdx >= saved.queue.length) setIsFinished(true);
                        }
                    } catch (e) { console.error("Load failed", e); }
                }

                if (!loaded) {
                    const now = Date.now();
                    let q = [];
                    const groupSize = config.groupSize || 208;
                    
              if (sessionConfig.type === 'review') {
                        // 1. 找出到了时间的词
                        q = words.filter(w => {
                            if (!w.stats) return false;
                            const isDue = w.stats.nextReview <= Date.now();
                            const isRelearning = w.stats.interval === 0 && w.stats.reviewCount > 0;
                            const isNormalReview = w.stats.interval > 0;
                            return isDue && (isNormalReview || isRelearning);
                        });

                        // 2. 兜底逻辑
                        if (q.length === 0) {
                            q = words.filter(w => w.stats && w.stats.reviewCount > 0 && w.stats.interval <= 1);
                        }
                        
                        // 🔥 3. 核心修改：按紧急程度排序，并截取前 200 个
                        // (interval 越小越紧急，nextReview 越早越紧急)
                        q.sort((a, b) => {
                            if (a.stats.interval !== b.stats.interval) return a.stats.interval - b.stats.interval;
                            return a.stats.nextReview - b.stats.nextReview;
                        });

                        // ✂️ 限制最大数量为 200
                        if (q.length > 200) {
                            q = q.slice(0, 200);
                        }
                        // 如果觉得顺序太死板，可以在截取后 shuffle 一下，这里保留排序以便优先复习重点
                    } else if (sessionConfig.type === 'group_study') {
                        const catWords = words.filter(w => (w.category || 'uncategorized') === sessionConfig.category);
                        const batchId = sessionConfig.batchId;
                        const batchWords = catWords.filter(w => (w.importId || 'default') === batchId);
                        const start = sessionConfig.batchIndex * groupSize;
                        const end = start + groupSize;
                        const targetGroup = batchWords.slice(start, end);
                        if (sessionConfig.filter === 'hard') {
                            targetGroup = targetGroup.filter(w => !w.stats || w.stats.interval <= 1);
                        }
                        const newWords = targetGroup.filter(w => !w.stats || w.stats.interval === 0);
                        const reviewWords = targetGroup.filter(w => w.stats && w.stats.interval !== 0);
                        q = [...newWords, ...reviewWords];
                    }
                    
                    setQueue(q);
                    setCurrentIdx(0);
                    if(q.length > 0) {
                        const initialData = { queue: q, currentIdx: 0, timestamp: Date.now() };
                        localStorage.setItem(key, JSON.stringify(initialData));
                    }
                }
            }, [sessionConfig]); 

            useEffect(() => { if (queue.length > 0 && !isFinished && !isFlipped) { const word = queue[currentIdx]?.word; if (word) { const timer = setTimeout(() => playAudio(word), 300); return () => clearTimeout(timer); } } }, [currentIdx, queue, isFinished]);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                    setIsFullscreen(true);
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); setIsFullscreen(false); }
                }
            };

            const currentCard = queue[currentIdx];
            
            const groupedMeanings = useMemo(() => {
                if (!currentCard || !currentCard.meanings) return [];
                const groups = [];
                currentCard.meanings.forEach((m, idx) => {
                    const lastGroup = groups[groups.length - 1];
                    if (lastGroup && lastGroup.pos === m.pos) {
                        lastGroup.items.push({ ...m, originalIdx: idx });
                    } else {
                        groups.push({ pos: m.pos, items: [{ ...m, originalIdx: idx }] });
                    }
                });
                return groups;
            }, [currentCard]);

            // 🔥 核心评分逻辑 (严格遵循“最低熟练度”原则)
            const handleRating = (rating) => {
                const word = currentCard;
                setHistory(prev => [...prev, { wordId: word.id, oldStats: word.stats, idx: currentIdx, addedToQueue: rating === 1 || rating === 2 }]);

                // 🔥 严格模式逻辑：这是同一天内因为“不熟”而插入队列的回头客
                if (word.isRepeat) {
                    // 如果这次点的不是“不会”(1)，不管是“熟练”(3)还是“不熟”(2)
                    // 都视为“本次巩固完成”，直接跳过，保留第一次评分时的“惨状”。
                    if (rating !== 1) { 
                        setIsFlipped(false); 
                        const nextIdx = currentIdx + 1;
                        setTimeout(() => {
                            if (nextIdx >= queue.length) setIsFinished(true);
                            else setCurrentIdx(nextIdx);
                            saveProgress(queue, nextIdx); 
                        }, 250); 
                        return; // 结束函数，不执行 updateWords
                    }
                    // 如果点了“不会”(1)，则代码继续向下执行，触发降级逻辑。
                }

                // --- 常规逻辑 (新词，或第一次不熟，或重复时依然不会) ---
                const currentStats = word.stats || { interval: 0, easeFactor: 2.5, nextReview: 0, reviewCount: 0, lastReviewTime: 0 };
               // 在 handleRating 函数内：

                const result = calculateNextReview(rating, currentStats.interval, currentStats.easeFactor, currentStats.reviewCount, currentStats.lastReviewTime);

                const newStats = { 
                interval: result.interval, 
                easeFactor: result.easeFactor, 
                // 🔥 修改这里：优先使用 calculateNextReview 返回的对齐时间
                       nextReview: result.nextReview || (Date.now() + (result.interval * 24 * 60 * 60 * 1000)), 
                       reviewCount: result.reviewCount,
                       lastReviewTime: Date.now()
               };
                
                const updatedWords = words.map(w => w.id === word.id ? { ...w, stats: newStats } : w);
                setWords(updatedWords);
                localStorage.setItem('kaoyan_vocab_list', JSON.stringify(updatedWords));
                
                let nextQueue = [...queue];
                // 如果需要死磕，插入队列
                if (result.isDueNow) {
                    let insertOffset = 3 + Math.floor(Math.random() * 4); 
                    let insertIndex = currentIdx + 1 + insertOffset;
                    // 标记 isRepeat，下次遇到它进入严格模式
                    const repeatCard = { ...word, stats: newStats, isRepeat: true };
                    if (insertIndex >= nextQueue.length) { nextQueue.push(repeatCard); } 
                    else { nextQueue.splice(insertIndex, 0, repeatCard); }
                    setQueue(nextQueue);
                }
                
                setIsFlipped(false);
                const nextIdx = currentIdx + 1;
                
                setTimeout(() => {
                    if (nextIdx >= nextQueue.length) setIsFinished(true);
                    else setCurrentIdx(nextIdx);
                    saveProgress(nextQueue, nextIdx);
                }, 250);
            };

            const toggleMeaningMastery = (e, mIdx) => { e.stopPropagation(); const newQueue=[...queue]; const card={...newQueue[currentIdx]}; const meanings=[...card.meanings]; meanings[mIdx]={...meanings[mIdx], isMastered:!meanings[mIdx].isMastered, _forceShow:false}; card.meanings=meanings; newQueue[currentIdx]=card; setQueue(newQueue); const newWords=[...words]; const idx=newWords.findIndex(w=>w.id===currentCard.id); if(idx!==-1){ newWords[idx]={...newWords[idx], meanings:meanings}; setWords(newWords); localStorage.setItem('kaoyan_vocab_list', JSON.stringify(newWords)); } saveProgress(newQueue, currentIdx); };
            const toggleForceShow = (mIdx) => { const newQueue=[...queue]; const card={...newQueue[currentIdx]}; const meanings=[...card.meanings]; meanings[mIdx]={...meanings[mIdx], _forceShow:!meanings[mIdx]._forceShow}; card.meanings=meanings; newQueue[currentIdx]=card; setQueue(newQueue); };
            
            const generateWordNote = async (e, forceRegenerate = false) => {
                e.stopPropagation(); 
                if (!forceRegenerate && currentCard.aiNote) return;
                if (!config.apiKey) { alert("请设置 API Key"); return; } 
                setIsGeneratingNote(true); 
                try {
                    const prompt = `针对考研英语，请为单词 "${currentCard.word}" 生成一份【综合避坑指南】。请用 Markdown 列表格式，包含：\n1. **熟词僻义**：列出真题中常考但容易被忽略的意思。\n2. **易混辨析**：最容易搞混的 1-2 个词。\n3. **真题坑点**：常见的搭配陷阱或理解误区。\n\n要求：合并输出，总字数控制在 100 字以内，干货为主。`;
                    let newNote = "";
                    let baseUrl = config.baseUrl.replace(/\/$/, "");
                    if (!baseUrl.includes("/v1") && !baseUrl.includes("aliyuncs") && !baseUrl.includes("bigmodel")) baseUrl += "/v1";
                    const res = await fetch(`${baseUrl}/chat/completions`, { method: 'POST', headers: {'Content-Type':'application/json', 'Authorization':`Bearer ${config.apiKey}`}, body: JSON.stringify({model:config.model, messages:[{role:"user",content:prompt}]}) }); 
                    const data = await res.json(); newNote = data.choices?.[0]?.message?.content;
                    if(newNote) { 
                        const s = newNote.trim(); const newWords = [...words]; const targetWord = newWords.find(w => w.id === currentCard.id);
                        if(targetWord) targetWord.aiNote = s;
                        setWords(newWords); localStorage.setItem('kaoyan_vocab_list', JSON.stringify(newWords)); 
                        const newQueue = [...queue]; newQueue[currentIdx].aiNote = s; setQueue(newQueue); 
                        saveProgress(newQueue, currentIdx);
                    }
                } catch(e){ alert("生成失败: " + e.message); } finally { setIsGeneratingNote(false); }

            const performSyntaxSurgery = async (e, forceRegenerate = false) => {
                e.stopPropagation();
                if (!forceRegenerate && currentCard.aiSyntax) {
                    setSyntaxModal({ open: true, content: currentCard.aiSyntax });
                    return;
                }
                if (!config.apiKey) return alert("请先配置 API Key");
                setSyntaxLoading(true);
                setSyntaxModal({ open: true, content: '' }); 

                const prompt = `请作为考研英语专家，用单词 "${currentCard.word}" 造一个**考研真题难度**的长难句（约30词）。然后进行【语法手术刀】分析。为了在手机上阅读清晰，**严禁使用 Markdown 表格**，请严格使用以下格式：\n\n### 🧬 考研长难句\n> (这里写英文句子，将 **${currentCard.word}** 加粗)\n\n(这里写中文翻译，灰色字体)\n\n---\n\n### 🦴 核心骨架 (主干)\n* **主语**：...\n* **谓语**：...\n* **宾语**：...\n\n### 🍃 修饰成分 (皮肉)\n* **定语从句**：(摘录从句)... -> 修饰 (先行词)\n* **状语**：(摘录)... -> 表示 (时间/原因等)\n* **插入语/同位语**：...\n\n### 💡 语法考点\n1.  **点 1**：(解释)\n2.  **点 2**：(解释)`;

                try {
                    let fullText = "";
                    let baseUrl = config.baseUrl.replace(/\/$/, "");
                    if (!baseUrl.includes("/v1") && !baseUrl.includes("aliyuncs") && !baseUrl.includes("bigmodel")) baseUrl += "/v1";
                    const response = await fetch(`${baseUrl}/chat/completions`, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${config.apiKey}` }, body: JSON.stringify({ model: config.model, messages: [{ role: "user", content: prompt }], stream: true }) });
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split("\n");
                        for (const line of lines) {
                            if (line.startsWith("data: ")) {
                                const data = line.slice(6);
                                if (data === "[DONE]") break;
                                try { const json = JSON.parse(data); const delta = json.choices[0]?.delta?.content || ""; fullText += delta; setSyntaxModal(prev => ({ ...prev, content: fullText })); } catch (e) { }
                            }
                        }
                    }
                    const newWords = [...words];
                    const targetWord = newWords.find(w => w.id === currentCard.id);
                    if(targetWord) targetWord.aiSyntax = fullText;
                    setWords(newWords);
                    localStorage.setItem('kaoyan_vocab_list', JSON.stringify(newWords));
                    const newQueue = [...queue]; newQueue[currentIdx].aiSyntax = fullText; setQueue(newQueue);
                    saveProgress(newQueue, currentIdx);
                } catch (e) { setSyntaxModal(prev => ({ ...prev, content: "**分析失败**：" + e.message })); } finally { setSyntaxLoading(false); }
            };

            // 重置逻辑 (仅分组模式)

     // --- 🔥 拼写模式最终版 (含生词筛选、强制重写、Strict模式) ---
        const SpellingSession = ({ words, setWords, sessionConfig, onExit, config }) => {
            const [queue, setQueue] = useState([]);

                const base = `kaoyan_prog_${dateStr}_${sessionConfig.type}${suffix}`;
                if (sessionConfig.type.includes('group')) return `${base}_${sessionConfig.batchId}_${sessionConfig.batchIndex}`;

                    alert(`🎉 强力修复成功！\n\n已成功拆分 ${fixedCount} 个单词。\n解决了像 "干v." 这样中间没有空格的问题。`); 
                } else { 
                    alert("未发现需要修复的单词。\n(请确认你的单词释义中确实包含 'v. ' 这种带点的形式)"); 
                }
            };



            // 🔥 强力拆分，包含逗号！
            const deepSplitMeanings = () => {
                let splitCount = 0;
                let wordCount = 0;
                const newWords = words.map(w => {
                    let hasSplit = false;
                    let newMeanings = [];
                    w.meanings.forEach(m => {
                        const separators = /[;；，,]|\s\d+\.\s/; 
                        if (m.def.match(separators)) {
                            hasSplit = true;
                            // 拆分
                            const parts = m.def.split(separators)
                                .map(s => s.trim().replace(/^\d+\.\s*/, ''))
                                .filter(s => s && s.length > 0);
                            
                            parts.forEach(part => {
                                // 检查去重
                                if (!newMeanings.some(nm => nm.pos === m.pos && nm.def === part)) {
                                    newMeanings.push({ ...m, def: part, sentence: m.sentence || "" }); 
                                    splitCount++;
                                }
                            });
                        } else {
                            newMeanings.push(m);
                        }
                    });
                    if (hasSplit) wordCount++;
                    return { ...w, meanings: newMeanings };
                });

                if (splitCount > 0) {
                    setWords(newWords);
                    localStorage.setItem('kaoyan_vocab_list', JSON.stringify(newWords));
                    alert(`🔪 释义拆分完成！\n\n处理了 ${wordCount} 个单词\n\n现在去背单词页面，你会发现：\n1. 同一词性的意思被【合并】在一个框里了（不乱了）\n2. 框里的每一行意思都可以【单独隐藏】了（满足你的需求）`);
                } else {
                    alert("数据看起来已经是拆分好的状态了，可以直接去背单词！");
                }
            };

           const fetchWordsFromAI = async () => {
                if (!config.apiKey) { alert("请配置 Key"); return; } 
                if (!aiInput.trim()) return; 
                
                const wordList = aiInput.split(/[\s,\n]+/).filter(w => w.trim().match(/^[a-zA-Z\-]+$/)); 
                if(wordList.length===0) return;
                
                setIsFetching(true); 
                setFetchProgress({ current: 0, total: wordList.length, success: 0, fail: 0 }); 
                
                const targetCat = getTargetCategory(); 
                const batchId = isNewBatch ? `batch-${Date.now()}` : 'default'; 
                saveBatchMeta(batchId);
                
                const BATCH_SIZE = 5; 
                let currentWords = JSON.parse(JSON.stringify(words)); 
                let successCount = 0; 
                let failCount = 0;
                
                for (let i = 0; i < wordList.length; i += BATCH_SIZE) {
                    const batch = wordList.slice(i, i + BATCH_SIZE); 
                    const batchStr = batch.join(", "); 
                    const prompt = `考研单词查询JSON:[${batchStr}]`;
                    
                    try {
                        let jsonStr=""; 
                        if(config.type==='google'){ 
                            const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey.trim()}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})}); 
                            const data=await res.json(); 
                            jsonStr=data.candidates?.[0]?.content?.parts?.[0]?.text; 
                        } else { 
                            let baseUrl=config.baseUrl.replace(/\/$/,""); 
                            if(!baseUrl.includes("/v1")&&!baseUrl.includes("aliyuncs")&&!baseUrl.includes("bigmodel")&&!baseUrl.includes("lingyiwanwu")&&!baseUrl.includes("siliconflow"))baseUrl+="/v1"; 
                            const res=await fetch(`${baseUrl}/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${config.apiKey.trim()}`},body:JSON.stringify({model:config.model,messages:[{role:"user",content:prompt}]})}); 
                            const data=await res.json(); 
                            jsonStr=data.choices?.[0]?.message?.content; 
                        }
                        
                        if(!jsonStr) throw new Error("Empty"); 
                        jsonStr=jsonStr.replace(/```json/g,'').replace(/```/g,'').trim(); 
                        const parsedBatch=JSON.parse(jsonStr);
                        
                        if(Array.isArray(parsedBatch)){ 
                            parsedBatch.forEach(item=>{ 
                                const existIdx=currentWords.findIndex(w=>w.word.toLowerCase()===item.word.toLowerCase()); 
                                const meanings=item.meanings.map(m=>({...m,sentence:"",isMastered:false})); 
                                
                                if(!isNewBatch && existIdx!==-1){ 
                                    // 🔥 核心修复：检测是否有新释义加入
                                    let hasNew = false;
                                    item.meanings.forEach(nm=>{ 
                                        if(!currentWords[existIdx].meanings.some(om=>om.pos===nm.pos && om.def===nm.def)) {
                                            currentWords[existIdx].meanings.push({...nm,sentence:"",isMastered:false}); 
                                            hasNew = true;
                                        }
                                    }); 
                                    // 🔥 如果有新释义，强制重置复习进度，确保该词会再次出现在复习中
                                    if (hasNew) {
                                        currentWords[existIdx].stats = { interval: 0, easeFactor: 2.5, nextReview: 0, reviewCount: 0 };
                                    }
                                } else { 
                                    currentWords.push({id:`ai-${Date.now()}-${Math.random()}`,word:item.word,phonetic:item.phonetic||"",category:targetCat,importId:batchId,meanings,stats:{interval:0,easeFactor:2.5,nextReview:0,reviewCount:0}}); 
                                } 
                            }); 
                            successCount+=batch.length; 
                        }
                    } catch(err){ 
                        failCount+=batch.length; 
                    }
                    setFetchProgress({ current: Math.min(i+BATCH_SIZE, wordList.length), total: wordList.length, success: successCount, fail: failCount }); 
                    setWords([...currentWords]); 
                    localStorage.setItem('kaoyan_vocab_list', JSON.stringify(currentWords));
                } 
                setIsFetching(false); 
                alert("完成"); 
                setImportBatchName('');
            };

            const handleFile = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const content = JSON.parse(ev.target.result); if (content.type === 'KAOYAN_FULL_BACKUP' && content.storage) { if(confirm(`恢复备份将覆盖当前数据，确定吗？`)) { Object.keys(content.storage).forEach(key => { if(key.startsWith('kaoyan_')) localStorage.setItem(key, content.storage[key]); }); window.location.reload(); } return; } if (Array.isArray(content)) { if(confirm(`导入旧版单词表?`)) { setWords(content); localStorage.setItem('kaoyan_vocab_list', JSON.stringify(content)); alert("完成"); } return; } } catch(err) { alert("错误"); } }; reader.readAsText(file); };
            const exportFullData = async () => {

                            <button onClick={() => setActiveTab('text')} className={`flex-1 pb-3 text-sm md:text-base font-bold transition-colors border-b-2 ${activeTab==='text'?'border-indigo-600 text-indigo-600':'border-transparent text-gray-400 hover:text-gray-600'}`}>批量粘贴</button>

                                </div>

                        {(activeTab === 'ai' || activeTab === 'text') && (

                                <label className="flex items-center pt-4 border-t border-gray-200 cursor-pointer"><input type="checkbox" checked={isNewBatch} onChange={e=>setIsNewBatch(e.target.checked)} className="w-4 h-4 text-indigo-600"/><span className="ml-2 text-sm font-bold text-gray-700">独立为新批次</span></label>
                                {isNewBatch && (<div className="mt-4 animate-fade-in"><input type="text" value={importBatchName} onChange={e=>setImportBatchName(e.target.value)} placeholder="例如: 2015真题" className="w-full p-3 border border-indigo-200 bg-indigo-50 rounded-lg text-sm outline-none"/></div>)}
                            </div>

                        {activeTab === 'ai' && (<div className="space-y-4"><textarea value={aiInput} onChange={e => setAiInput(e.target.value)} placeholder="输入单词..." className="w-full h-40 p-4 border rounded-xl text-sm outline-none resize-none"></textarea>{isFetching ? <div className="text-center text-sm py-3 bg-indigo-50 text-indigo-600 rounded-xl animate-pulse">AI 抓取中...</div> : <button onClick={fetchWordsFromAI} className="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2"><Icon name="CloudDownload" size={20}/> 开始</button>}</div>)}

      const SettingsPanel = ({ config, setConfig, setView }) => {

        const App = () => {

                if(loader && loader.style.border) loader.remove();
            }, []);

         const handleBack = () => {
    // 👇 修改判断条件，加入 view === 'spelling'
    if (view === 'study' || view === 'spelling') {
        // 👇 修改跳转逻辑，如果 type 包含 group 字样，就回分组列表
        if (sessionConfig.type && sessionConfig.type.includes('group')) setView('group_list');
        else setView('home');
    } else if (view === 'group_list') setView('home');
    else setView('home');
};
            
            return (
                <div className="h-full flex flex-col bg-gray-50">
                    <Navbar view={view} setView={setView} />
                    <main className="flex-1 overflow-hidden flex flex-col relative">
                        {view === 'home' && <Dashboard words={words} setView={setView} setSessionConfig={setSessionConfig} />}
                        {view === 'group_list' && <GroupList words={words} setWords={setWords} category={sessionConfig.category} setView={setView} setSessionConfig={setSessionConfig} config={config} />}
                        {view === 'study' && <StudySession words={words} setWords={setWords} sessionConfig={sessionConfig} onExit={handleBack} config={config} setChatSession={setChatSession} />}
                        {view === 'spelling' && <SpellingSession words={words} setWords={setWords} sessionConfig={sessionConfig} onExit={handleBack} config={config} />}
                        {view === 'list' && <WordListMode words={words} setWords={setWords} setChatSession={setChatSession} />}
                        {view === 'import' && <ImportExport setWords={setWords} words={words} setView={setView} config={config} />}
                        {view === 'settings' && <SettingsPanel config={config} setConfig={setConfig} setView={setView} />}
{chatSession && (<div className="absolute inset-0 z-50 bg-black/20 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 animate-fade-in"><WordChat word={chatSession} words={words} setWords={setWords} onClose={() => setChatSession(null)} config={config} /></div>)}                    </main>
                    <style>{`
                        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
                        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
                        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
                        .animate-fade-in { animation: fade-in 0.2s ease-out; }
                    `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
